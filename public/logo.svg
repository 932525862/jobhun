<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="briefcase-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0052CC" />
    </linearGradient>
  </defs>

  <!-- Briefcase Icon Group -->
  <g transform="translate(10, 10)">
    <!-- Briefcase Handle -->
    <path d="M 32,18 C 32,10 42,6 50,6 L 70,6 C 78,6 88,10 88,18 L 88,24 L 32,24 Z" fill="none" stroke="#0066FF" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Briefcase Body -->
    <rect x="10" y="24" width="100" height="76" rx="22" fill="url(#briefcase-grad)"/>

    <!-- White Smiling Arc -->
    <path d="M 34,56 C 44,72 76,72 86,56 C 80,64 56,64 34,56 Z" fill="#FFFFFF"/>
  </g>

  <!-- Brand Typography -->
  <!-- "job" in Bold Navy -->
  <text x="135" y="80" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="64" font-weight="800" fill="#091E42" letter-spacing="-1.5">job</text>
  
  <!-- "hunt" in Medium Slate Grey -->
  <text x="232" y="80" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="64" font-weight="600" fill="#6B778C" letter-spacing="-1">hunt</text>
</svg>
